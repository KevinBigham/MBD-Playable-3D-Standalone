<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBD Catcher Mask Forge Review</title>
    <style>
      :root { color: #eaf0f5; background: #0b1016; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 15%, #253240 0, #101821 44%, #080c11 100%); }
      header { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid #35414c; }
      h1 { margin: 0; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
      .status { color: #a9e1c1; font-size: 12px; letter-spacing: .08em; }
      main { display: grid; grid-template-columns: 1fr 1.38fr; height: calc(100vh - 72px); }
      .reference { position: relative; display: grid; place-items: center; padding: 34px; border-right: 1px solid #35414c; background: #d2d2d3; }
      .reference img { width: min(100%, 520px); height: min(100%, 520px); object-fit: contain; }
      .stage { position: relative; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
      .label { position: absolute; left: 18px; top: 16px; z-index: 2; padding: 7px 10px; border: 1px solid #627181; border-radius: 4px; background: rgba(7,12,17,.78); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .metrics { position: absolute; left: 18px; bottom: 16px; z-index: 2; color: #bfccd8; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body.capture header, body.capture .reference, body.capture .label, body.capture .metrics { display: none; }
      body.capture main { display: block; height: 100vh; }
      body.capture .stage { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <header><h1>MBD Catcher Mask · img2threejs blockout gate</h1><div class="status">REFERENCE → PROCEDURAL PROTOTYPE → NATIVE FACTORY</div></header>
    <main>
      <section class="reference"><span class="label">Admitted reference</span><img src="/@fsdocs/references/equipment/catcher-mask.png" alt="Catcher mask reference" /></section>
      <section class="stage"><span class="label">Neutral evaluation render · no post FX</span><div class="metrics" id="metrics"></div><canvas id="stage"></canvas></section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
