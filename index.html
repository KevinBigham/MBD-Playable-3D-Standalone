<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the game paint under a notch; the layout pulls the
      controls back out of it with env(safe-area-inset-*). user-scalable=no is
      here for exactly one reason: a double-tap on an action button during a
      swing must not zoom the field. Nothing readable is hidden by it — the
      whole interface is sized in viewport units and scales with the screen.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Kept short on purpose: iOS truncates a home-screen label at roughly a
         dozen characters, and "Mr. Baseball…" is not a name. -->
    <meta name="apple-mobile-web-app-title" content="MBD" />
    <meta
      name="description"
      content="Mr. Baseball Dynasty - an original arcade baseball game for the browser, on a desktop or a phone."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <!--
      iOS ignores an SVG apple-touch-icon. Without this line, Add to Home Screen
      does not fall back to the favicon — it screenshots the page, so the game
      lands on the home screen wearing a picture of its own loading card. The
      PNG is generated from icon.svg by scripts/icons.ts; regenerate rather than
      edit it.
    -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>Mr. Baseball Dynasty</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui"></div>
      <div id="boot">
        <div class="boot-mark">MR. BASEBALL<span>DYNASTY</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-note">Taking the field…</div>
      </div>
      <noscript>
        <div class="noscript">Mr. Baseball Dynasty needs JavaScript enabled to run.</div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
