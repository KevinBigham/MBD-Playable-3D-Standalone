  <circle cx="256" cy="256" r="118" fill="#f4efe3"/>
  <g fill="none" stroke="#c4392b" stroke-width="11" stroke-linecap="round">
    <path d="M170 176a150 150 0 0 1 0 160"/>
    <path d="M342 176a150 150 0 0 0 0 160"/>
  </g>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#ffd15c" stroke-width="13"/>
</svg>
