<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mr. Baseball Dynasty">
  <!-- Maskable: everything that matters stays inside the middle 80%, because
       the launcher is free to crop this to a circle, a squircle or a rounded
       square and will. The crown is the first thing a crop would eat, so both
       it and the ball are pulled in tighter than on the plain icon. -->
  <rect width="512" height="512" fill="#0b1020"/>
  <circle cx="256" cy="300" r="104" fill="#f4efe3"/>
  <g fill="none" stroke="#c4392b" stroke-width="10" stroke-linecap="round">
    <path d="M181 232a132 132 0 0 1 0 136"/>
    <path d="M331 232a132 132 0 0 0 0 136"/>
  </g>
  <circle cx="256" cy="300" r="104" fill="none" stroke="#ffd15c" stroke-width="11"/>
  <path
    d="M180 214v-64l42 36 34-47 34 47 42-36v64z"
    fill="#ffd15c"
    stroke="#0b1020"
    stroke-width="10"
    stroke-linejoin="round"
  />
</svg>
